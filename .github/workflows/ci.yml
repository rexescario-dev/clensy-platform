name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Jest does not type-check (isolatedModules) and `nest build` excludes
      # tests, so this is the only check of type errors in `apps/api`,
      # including the audit type contract's @ts-expect-error lines (#90).
      - name: Type-check apps/api
        run: pnpm --filter api exec tsc --noEmit

      # Vitest does not type-check, and CI does not run `next build`, so this
      # is the only check of type errors in `apps/web`, including the
      # override type contract's @ts-expect-error lines (#115).
      - name: Type-check apps/web
        run: pnpm --filter web exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test

  release-gate:
    # #92 two-tenant isolation release gate against a fresh, migrated
    # database. Credentials are throwaway values for this job's own service
    # container; no secret is needed (tests use the built-in JWT fallback).
    name: Release gate
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: clensy
      DB_PASSWORD: clensy_ci
      DB_NAME: clensy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clensy
          POSTGRES_PASSWORD: clensy_ci
          POSTGRES_DB: clensy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clensy -d clensy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api migration:run

      - run: pnpm --filter api test:e2e:release-gate

  api-e2e:
    # #135: every API e2e suite except the release gate, which keeps its own
    # job above. The #90 / #106 guard suites run here, so a field added
    # without being classified fails CI instead of only local runs. Required
    # on `main` by the `main: required CI checks` ruleset (#140): do not
    # change `name:` without updating the ruleset in the same change.
    name: API e2e
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: clensy
      DB_PASSWORD: clensy_ci
      DB_NAME: clensy
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clensy
          POSTGRES_PASSWORD: clensy_ci
          POSTGRES_DB: clensy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clensy -d clensy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `apps/api/public/graphiql/` is gitignored, so a fresh checkout lacks
      # it, and app.e2e-spec.ts serves those files (#135).
      - run: pnpm --filter api build:graphiql

      - run: pnpm --filter api migration:run

      - run: pnpm --filter api test:e2e --testPathIgnorePatterns two-tenant-release-gate
