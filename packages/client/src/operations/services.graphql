query Services($paging: OffsetPaging, $filter: ServiceFilter, $sorting: [ServiceSort!]) {
  services(paging: $paging, filter: $filter, sorting: $sorting) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    nodes {
      id
      name
      durationMinutes
      active
      activePricing {
        priceMinorUnits
      }
    }
  }
}

query Service($id: ID!) {
  service(id: $id) {
    id
    name
    description
    durationMinutes
    active
    activePricing {
      id
      priceMinorUnits
    }
  }
}

mutation CreateService($input: CreateServiceInput!) {
  createService(input: $input) {
    id
  }
}

mutation UpdateService($id: ID!, $input: UpdateServiceInput!) {
  updateService(id: $id, input: $input) {
    id
  }
}

mutation CreatePricingRule($input: CreatePricingRuleInput!) {
  createPricingRule(input: $input) {
    id
    priceMinorUnits
  }
}
