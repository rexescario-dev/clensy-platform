query Bookings($paging: OffsetPaging, $filter: BookingFilter, $sorting: [BookingSort!]) {
  bookings(paging: $paging, filter: $filter, sorting: $sorting) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    nodes {
      id
      scheduledAt
      status
      pricingSnapshot {
        priceMinorUnits
      }
      customer {
        id
        fullName
      }
      property {
        id
        addressLine1
      }
      service {
        id
        name
      }
      team {
        id
        name
      }
    }
  }
}

query Booking($id: ID!) {
  booking(id: $id) {
    id
    scheduledAt
    status
    pricingSnapshot {
      priceMinorUnits
    }
    customer {
      id
      fullName
    }
    property {
      id
      addressLine1
    }
    service {
      id
      name
    }
    team {
      id
      name
    }
  }
}

mutation CreateBooking($createBookingInput: CreateBookingInput!) {
  createBooking(createBookingInput: $createBookingInput) {
    id
  }
}

mutation UpdateBooking($updateBookingInput: UpdateBookingInput!) {
  updateBooking(updateBookingInput: $updateBookingInput) {
    id
  }
}

mutation RemoveBooking($id: ID!) {
  removeBooking(id: $id) {
    id
  }
}
